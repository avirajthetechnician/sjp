<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RZFPHSpC/vvvcb.jpg"><title>Reset Password | SJP Forum</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#171717;min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:32px;max-width:500px;width:100%;box-shadow:0 15px 45px #00000012}.brand{font-weight:900;font-size:22px;margin-bottom:25px}.brand span{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#ff6b00;color:#fff;font-size:13px;margin-right:9px}.field{margin:18px 0}.field label{display:block;font-weight:750;margin-bottom:8px}.field input{width:100%;border:1px solid #ddd;border-radius:10px;padding:13px;font:inherit}.btn{border:0;border-radius:11px;padding:13px 17px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#ff6b00;color:#fff;width:100%}.secondary{background:#fff;border:1px solid #ddd;margin-top:10px;width:100%}.msg{margin:15px 0;padding:12px;border-radius:10px;background:#fff0e6;color:#8a3a00;display:none}.success{background:#eefbf3;color:#176b36}.hidden{display:none}</style></head><body><main class="box"><div class="brand"><span>SJP</span>Samboy Janta Party</div><section id="request"><h1>Forgot your password?</h1><p>Enter your forum account email and we'll send you a secure password reset link.</p><div id="msg" class="msg"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button class="btn primary" id="send">Send reset link</button><button class="btn secondary" onclick="location.href='forum.html'">Back to Forum</button></section><section id="update" class="hidden"><h1>Choose a new password</h1><p>Enter your new forum password below.</p><div id="updateMsg" class="msg"></div><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Enter it again"></div><button class="btn primary" id="save">Update password</button></section></main><script>const SUPABASE_URL='https://ibsstkeskpjxgbmzpeqg.supabase.co';const SUPABASE_KEY='sb_publishable_L7LhhHbBkhNEjiiqJXWIGQ_OnfdTuFQ';const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};const msg=document.getElementById('msg'),updateMsg=document.getElementById('updateMsg');function show(el,text,success=false){el.textContent=text;el.className='msg'+(success?' success':'');el.style.display='block'}async function sendReset(){const email=document.getElementById('email').value.trim();if(!email)return show(msg,'Please enter your email address.');const r=await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers,body:JSON.stringify({email,redirect_to:location.origin+location.pathname})});if(!r.ok){let d={};try{d=await r.json()}catch(e){}return show(msg,d.msg||d.message||'Could not send the reset email. Please try again.')}show(msg,'Reset link sent! Check your email and click the link to choose a new password.',true)}async function updatePassword(){const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<6)return show(updateMsg,'Password must be at least 6 characters.');if(p!==c)return show(updateMsg,'The passwords do not match.');const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{...headers,Authorization:'Bearer '+sessionStorage.getItem('sjp_recovery_token')},body:JSON.stringify({password:p})});if(!r.ok){let d={};try{d=await r.json()}catch(e){}return show(updateMsg,d.msg||d.message||'Could not update your password. The reset link may have expired.')}show(updateMsg,'Password updated successfully! You can now sign in to the forum.',true);setTimeout(()=>location.href='forum.html',1200)}document.getElementById('send').onclick=sendReset;document.getElementById('save').onclick=updatePassword;(async()=>{const hash=new URLSearchParams(location.hash.slice(1));const access=hash.get('access_token');const type=hash.get('type');if(access&&type==='recovery'){sessionStorage.setItem('sjp_recovery_token',access);document.getElementById('request').classList.add('hidden');document.getElementById('update').classList.remove('hidden')}})();</script></body></html>
