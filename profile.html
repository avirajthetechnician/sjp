<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJP Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#151515}.top{background:#111;color:#fff;border-bottom:3px solid #ff6b00}.nav{max-width:1050px;margin:auto;min-height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-weight:900;display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ff6b00;font-size:11px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:35px 20px 70px}.profile{background:#fff;border:1px solid #e4e4e4;border-radius:22px;overflow:hidden}.cover{height:150px;background:linear-gradient(135deg,#111,#2c2c2c 55%,#ff6b00)}.main{padding:0 28px 30px}.avatar{width:108px;height:108px;border-radius:50%;margin-top:-54px;border:6px solid #fff;background:#ff6b00;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:12px}.name{font-size:30px;font-weight:900}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#eee;font-size:12px;font-weight:900}.admin{background:#111;color:#fff}.moderator{background:#e7f0ff;color:#225}.forum_handler{background:#fff0e6;color:#a43f00}.bio{margin:18px 0;color:#555;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:#f7f7f7;border-radius:13px;padding:16px}.stat b{display:block;font-size:25px}.stat span{color:#777;font-size:12px}.section{border-top:1px solid #eee;padding-top:22px;margin-top:22px}.section h2{margin:0 0 14px}.edit{display:grid;gap:12px}.edit input,.edit textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit}.edit textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.primary{background:#ff6b00;color:#fff}.secondary{background:#fff;border:1px solid #ddd}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#777}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;display:none}.toast.show{display:block}.loading{text-align:center;padding:60px}.post{padding:12px 0;border-bottom:1px solid #eee}.post a{color:#111;text-decoration:none;font-weight:800}.post small{display:block;color:#888;margin-top:4px}@media(max-width:600px){.main{padding:0 18px 25px}.name-row{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.cover{height:120px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="brand" href="forum.html"><span class="logo">SJP</span><span>SJP Forum</span></a><a href="forum.html">Back to Forum</a></div></header>
<main class="wrap"><div id="app" class="loading">Loading profile…</div></main><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://ibsstkeskpjxgbmzpeqg.supabase.co';
const SUPABASE_KEY='sb_publishable_L7LhhHbBkhNEjiiqJXWIGQ_OnfdTuFQ';
const token=localStorage.getItem('sjp_forum_token');
const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};
const app=document.getElementById('app');
const params=new URLSearchParams(location.search); let targetId=params.get('id'); let me=null; let profile=null;
function api(path,opts={}){return fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{...headers,...(token?{Authorization:'Bearer '+token}:{})}})}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(n){return (n||'Member').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function badge(r){return `<span class="badge ${esc(r)}">${esc(r)}</span>`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function getMe(){if(!token)return null;const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers});if(!r.ok)return null;return await r.json()}
async function load(){me=await getMe();if(!targetId&&me)targetId=me.id;if(!targetId){app.innerHTML='<div class="loading">Sign in to view a profile.</div>';return}const p=await api('forum_profiles?select=id,display_name,role,bio,avatar_url,created_at&id=eq.'+encodeURIComponent(targetId));if(!p.ok){app.innerHTML='<div class="loading">Could not load profile.</div>';return}const rows=await p.json();profile=rows[0];if(!profile){app.innerHTML='<div class="loading">Profile not found.</div>';return}const [postsR,commentsR]=await Promise.all([api('forum_posts?select=id,title,category,created_at&author_id=eq.'+encodeURIComponent(targetId)+'&order=created_at.desc&limit=8'),api('forum_comments?select=id,post_id,created_at&author_id=eq.'+encodeURIComponent(targetId))]);const posts=postsR.ok?await postsR.json():[];const comments=commentsR.ok?await commentsR.json():[];const mine=me?.id===profile.id;app.innerHTML=`<section class="profile"><div class="cover"></div><div class="main"><div class="avatar">${profile.avatar_url?`<img src="${esc(profile.avatar_url)}" alt="Avatar">`:esc(initials(profile.display_name))}</div><div class="name-row"><div><div class="name">${esc(profile.display_name)}</div>${badge(profile.role)}</div><div class="actions">${mine?'<button class="btn secondary" onclick="toggleEdit()">Edit profile</button>':''}</div></div><div class="bio">${esc(profile.bio||'No bio yet.')}</div><div class="stats"><div class="stat"><b>${posts.length}</b><span>Posts shown</span></div><div class="stat"><b>${comments.length}</b><span>Comments</span></div><div class="stat"><b>${new Date(profile.created_at).toLocaleDateString()}</b><span>Joined</span></div></div><div id="editor" class="section hidden"><h2>Edit profile</h2><div class="edit"><input id="displayName" maxlength="80" value="${esc(profile.display_name)}" placeholder="Display name"><textarea id="bio" maxlength="500" placeholder="Bio">${esc(profile.bio||'')}</textarea><input id="avatarUrl" maxlength="1000" value="${esc(profile.avatar_url||'')}" placeholder="Avatar image URL (optional)"><div class="actions"><button class="btn primary" onclick="saveProfile()">Save changes</button><button class="btn secondary" onclick="toggleEdit()">Cancel</button></div></div></div><div class="section"><h2>Recent posts</h2>${posts.length?posts.map(p=>`<div class="post"><a href="forum.html?post=${p.id}">${esc(p.title)}</a><small>${esc(p.category)} · ${new Date(p.created_at).toLocaleString()}</small></div>`).join(''):'<div class="muted">No posts yet.</div>'}</div></div></section>`}
function toggleEdit(){document.getElementById('editor')?.classList.toggle('hidden')}
async function saveProfile(){const display_name=document.getElementById('displayName').value.trim();const bio=document.getElementById('bio').value;const avatar_url=document.getElementById('avatarUrl').value.trim();if(display_name.length<2)return toast('Display name must be at least 2 characters.');const r=await api('forum_profiles?id=eq.'+encodeURIComponent(me.id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({display_name,bio,avatar_url})});if(!r.ok)return toast('Could not save: '+await r.text());toast('Profile updated');await load()}
load();
</script>
</body></html>
