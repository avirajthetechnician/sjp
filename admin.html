<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJP Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#151515}.top{background:#111;color:#fff;border-bottom:3px solid #ff6b00}.nav{max-width:1200px;margin:auto;min-height:72px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900}.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ff6b00;font-size:12px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:32px 22px 70px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#ff6b00;font-size:11px;font-weight:900}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}.head h1{font-size:42px;margin:7px 0}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px}.card{padding:20px}.card .num{font-size:32px;font-weight:900;margin-top:7px}.card .label{font-size:13px;color:#777}.panel{padding:22px;margin-bottom:20px}.panel h2{margin:0 0 16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:14px;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:#777}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:11px;font-weight:900}.admin{background:#111;color:#fff}.moderator{background:#e7f0ff;color:#225}.handler{background:#fff0e6;color:#a43f00}.member{background:#f1f1f1}.open{background:#ffe8e0;color:#a33}.reviewed{background:#e7f7ed;color:#176b38}.dismissed{background:#eee;color:#666}.btn{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;margin:2px}.primary{background:#ff6b00;color:#fff}.secondary{background:#fff;border:1px solid #ddd}.danger{background:#c62828;color:#fff}.success{background:#197b45;color:#fff}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls input,.controls select{border:1px solid #ddd;border-radius:9px;padding:9px;background:#fff}.empty{text-align:center;padding:28px;color:#777}.danger-row{background:#fff8f6}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:20}.toast.show{display:block}.blocked{max-width:620px;margin:80px auto;text-align:center;background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:40px}.blocked h1{margin-top:0}footer{text-align:center;padding:25px;color:#888}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.grid{grid-template-columns:1fr}.head h1{font-size:34px}.wrap{padding:25px 15px 50px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="brand" href="forum.html"><span class="logo">SJP</span><span>Forum Admin</span></a><div class="controls"><a href="forum.html">Forum</a><button class="btn secondary" id="logout">Sign out</button></div></div></header>
<main class="wrap" id="app"><div class="empty">Checking admin access…</div></main>
<div class="toast" id="toast"></div>
<footer>© 2026 Samboy Janta Party · Admin Dashboard</footer>
<script>
const SUPABASE_URL='https://ibsstkeskpjxgbmzpeqg.supabase.co';
const SUPABASE_KEY='sb_publishable_L7LhhHbBkhNEjiiqJXWIGQ_OnfdTuFQ';
const baseHeaders={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
let token=localStorage.getItem('sjp_forum_token'),user=null,profile=null;
const app=document.getElementById('app');
function api(path,opts={}){return fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{...baseHeaders,...(token?{Authorization:'Bearer '+token}:{})}})}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function badge(role){return `<span class="badge ${esc(role)}">${esc(role)}</span>`}
async function current(){if(!token)return false;const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{...baseHeaders,Authorization:'Bearer '+token}});if(!r.ok)return false;user=await r.json();const p=await api('forum_profiles?select=id,display_name,role,created_at&id=eq.'+encodeURIComponent(user.id));if(!p.ok)return false;const rows=await p.json();profile=rows[0]||null;return profile?.role==='admin'}
async function count(path){const r=await api(path+'&select=id',{method:'HEAD'});return r.ok?Number(r.headers.get('content-range')?.split('/')[1]||0):0}
async function stats(){const [members,posts,comments,reports]=await Promise.all([count('forum_profiles?'),count('forum_posts?'),count('forum_comments?'),count('forum_reports?')]);return {members,posts,comments,reports}}
async function loadUsers(){const r=await api('forum_profiles?select=id,display_name,role,created_at&order=created_at.desc');return r.ok?await r.json():[]}
async function loadPosts(){const r=await api('forum_posts?select=id,title,category,author_id,is_pinned,is_locked,is_hidden,created_at&order=created_at.desc');return r.ok?await r.json():[]}
async function loadReports(){const r=await api('forum_reports?select=id,post_id,comment_id,reporter_id,reason,status,created_at&order=created_at.desc');return r.ok?await r.json():[]}
async function logAction(action,type,id,details=''){await api('forum_moderation_logs',{method:'POST',headers:{...baseHeaders,Authorization:'Bearer '+token,Prefer:'return=minimal'},body:JSON.stringify({actor_id:user.id,action,target_type:type,target_id:id,details})})}
async function updateRole(id,role){if(id===user.id&&role!=='admin'){if(!confirm('Remove admin from your own account? You may lock yourself out of this dashboard.'))return}const r=await api('forum_profiles?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...baseHeaders,Authorization:'Bearer '+token,Prefer:'return=minimal'},body:JSON.stringify({role})});if(!r.ok)return toast('Role update failed: '+await r.text());await logAction('change_role','profile',null,`Changed ${id} to ${role}`);toast('Role updated');render()}
async function postAction(id,patch,action){const r=await api('forum_posts?id=eq.'+id,{method:'PATCH',headers:{...baseHeaders,Authorization:'Bearer '+token,Prefer:'return=minimal'},body:JSON.stringify(patch)});if(!r.ok)return toast('Action failed: '+await r.text());await logAction(action,'post',id,JSON.stringify(patch));toast('Post updated');render()}
async function deletePost(id){if(!confirm('Permanently delete this post and its comments?'))return;const r=await api('forum_posts?id=eq.'+id,{method:'DELETE',headers:{...baseHeaders,Authorization:'Bearer '+token}});if(!r.ok)return toast('Delete failed: '+await r.text());await logAction('delete','post',id);toast('Post deleted');render()}
async function reportStatus(id,status){const r=await api('forum_reports?id=eq.'+id,{method:'PATCH',headers:{...baseHeaders,Authorization:'Bearer '+token,Prefer:'return=minimal'},body:JSON.stringify({status})});if(!r.ok)return toast('Report update failed: '+await r.text());await logAction(status==='dismissed'?'dismiss_report':'review_report','report',id);toast('Report updated');render()}
async function render(){app.innerHTML='<div class="empty">Loading dashboard…</div>';const [s,users,posts,reports]=await Promise.all([stats(),loadUsers(),loadPosts(),loadReports()]);const openReports=reports.filter(r=>r.status==='open').length;app.innerHTML=`<div class="head"><div><div class="eyebrow">Restricted area</div><h1>Admin Dashboard</h1><div class="muted">Signed in as <strong>${esc(profile.display_name)}</strong> · ${badge('admin')}</div></div><button class="btn primary" onclick="render()">Refresh</button></div><section class="grid"><div class="card"><div class="label">Members</div><div class="num">${s.members}</div></div><div class="card"><div class="label">Posts</div><div class="num">${s.posts}</div></div><div class="card"><div class="label">Comments</div><div class="num">${s.comments}</div></div><div class="card"><div class="label">Open reports</div><div class="num">${openReports}</div></div></section><section class="panel"><h2>🚩 Reports</h2><div class="table-wrap"><table><thead><tr><th>Target</th><th>Reason</th><th>Status</th><th>Reported</th><th>Actions</th></tr></thead><tbody>${reports.length?reports.map(r=>`<tr class="${r.status==='open'?'danger-row':''}"><td>${r.post_id?'Post #'+r.post_id:'Comment #'+r.comment_id}</td><td>${esc(r.reason)}</td><td>${badge(r.status)}</td><td>${new Date(r.created_at).toLocaleString()}</td><td>${r.status==='open'?`<button class="btn success" onclick="reportStatus(${r.id},'reviewed')">Mark reviewed</button><button class="btn secondary" onclick="reportStatus(${r.id},'dismissed')">Dismiss</button>`:'<span class="muted">Done</span>'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No reports yet.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>👥 User Management</h2><div class="controls" style="margin-bottom:15px"><input id="userSearch" placeholder="Search username…" oninput="filterUsers()"></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Joined</th><th>Change role</th></tr></thead><tbody id="usersBody">${users.map(u=>`<tr data-user="${esc((u.display_name+' '+u.id).toLowerCase())}"><td><strong>${esc(u.display_name)}</strong><br><span class="meta">${esc(u.id)}</span></td><td>${badge(u.role)}</td><td>${new Date(u.created_at).toLocaleDateString()}</td><td><select onchange="updateRole('${u.id}',this.value)"><option value="member" ${u.role==='member'?'selected':''}>member</option><option value="forum_handler" ${u.role==='forum_handler'?'selected':''}>forum_handler</option><option value="moderator" ${u.role==='moderator'?'selected':''}>moderator</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>🛡️ Post Moderation</h2><div class="table-wrap"><table><thead><tr><th>Post</th><th>Category</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${posts.length?posts.map(p=>`<tr><td><strong>#${p.id}</strong> ${esc(p.title)}</td><td>${esc(p.category)}</td><td>${p.is_hidden?'<span class="badge open">hidden</span>':'<span class="badge reviewed">visible</span>'} ${p.is_locked?'<span class="badge">locked</span>':''} ${p.is_pinned?'<span class="badge">pinned</span>':''}</td><td>${new Date(p.created_at).toLocaleString()}</td><td><button class="btn secondary" onclick="postAction(${p.id},{is_pinned:${!p.is_pinned}},'${p.is_pinned?'unpin':'pin'}')">${p.is_pinned?'Unpin':'Pin'}</button><button class="btn secondary" onclick="postAction(${p.id},{is_locked:${!p.is_locked}},'${p.is_locked?'unlock':'lock'}')">${p.is_locked?'Unlock':'Lock'}</button><button class="btn secondary" onclick="postAction(${p.id},{is_hidden:${!p.is_hidden}},'${p.is_hidden?'unhide':'hide'}')">${p.is_hidden?'Unhide':'Hide'}</button><button class="btn danger" onclick="deletePost(${p.id})">Delete</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No posts yet.</td></tr>'}</tbody></table></div></section>`}
function filterUsers(){const q=document.getElementById('userSearch').value.toLowerCase();document.querySelectorAll('#usersBody tr').forEach(r=>r.style.display=r.dataset.user.includes(q)?'':'none')}
document.getElementById('logout').onclick=async()=>{await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{...baseHeaders,Authorization:'Bearer '+token}});localStorage.removeItem('sjp_forum_token');location.href='forum.html'};
(async()=>{if(!(await current())){app.innerHTML='<div class="blocked"><div class="eyebrow">Access denied</div><h1>Admin access required</h1><p class="muted">Sign in with an SJP admin account to open this dashboard.</p><a class="btn primary" href="forum.html">Go to forum</a></div>';return}await render()})();
</script>
</body>
</html>
